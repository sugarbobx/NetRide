version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netride
      POSTGRES_PASSWORD: netride_secret
      POSTGRES_DB: netride
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netride"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://netride:netride_secret@db:5432/netride?schema=public
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-}
      CAMPAY_USERNAME: ${CAMPAY_USERNAME:-}
      CAMPAY_PASSWORD: ${CAMPAY_PASSWORD:-}
      CAMPAY_BASE_URL: https://demo.campay.net/api
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
